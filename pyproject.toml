[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fwagent"
version = "0.1.0"
description = "AI Agent for Autonomous Embedded Firmware Testing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "jinja2",
    "matplotlib",
    "pyyaml",
]

[project.scripts]
fwagent = "fwagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

